name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/統合ツール/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install tool dependencies
        run: npm run setup

      - name: Check, test, and build
        run: npm run check

      - name: Verify generated files are current
        run: git diff --exit-code

      - name: Test standalone output layouts
        run: npm run test:output-layouts
