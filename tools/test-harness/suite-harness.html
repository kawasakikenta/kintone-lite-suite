<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>統合ツール ハーネス</title>
<style>
  body{margin:0;font:14px/1.6 system-ui,sans-serif;background:#0f172a;color:#e2e8f0}
  .top{padding:14px 20px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .top h1{margin:0;font-size:16px;color:#5eead4}
  .top button{background:#0f766e;border:1px solid #0f766e;color:#fff;border-radius:8px;padding:6px 14px;font:inherit;cursor:pointer}
  .top button.alt{background:#1e293b;border-color:#334155;color:#cbd5e1}
  .info{font-size:12px;color:#94a3b8}
  #log{padding:12px 20px;font:12px ui-monospace,Menlo,monospace;color:#94a3b8;max-height:160px;overflow:auto;border-bottom:1px solid #1e293b;background:#020617;white-space:pre-wrap}
  #log b{color:#5eead4}
</style>
</head><body>
<div class="top">
  <h1>🔧 統合ツール 起動ハーネス</h1>
  <button id="boot">統合ツールを起動 (popoutなし)</button>
  <button id="boot-popout" class="alt">popout モードで起動</button>
  <button id="reset" class="alt">リセット</button>
  <span class="info">kintone 環境の代わりに <code>window.kintone</code> をモックして起動します。</span>
</div>
<pre id="log"></pre>

<script>
// ---- minimal kintone mock ----
function log(...a){ const el = document.getElementById('log'); const line = a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' '); el.textContent += line + '\n'; el.scrollTop = el.scrollHeight; console.log(...a); }

const SAMPLE_FIELDS = {
  顧客名:   { code:'顧客名',   type:'SINGLE_LINE_TEXT', label:'顧客名',   required:true,  unique:false },
  金額:     { code:'金額',     type:'NUMBER',           label:'金額',     required:false, unit:'円', unitPosition:'AFTER' },
  ステータス: { code:'ステータス', type:'DROP_DOWN',        label:'ステータス', options:{ '見込':{label:'見込',index:'0'}, '商談中':{label:'商談中',index:'1'}, '受注':{label:'受注',index:'2'} } }
};
const SAMPLE_VIEWS = { '一覧': { name:'一覧', type:'LIST', index:'0', fields:['顧客名','金額','ステータス'] } };

const ROUTES = {
  '/k/v1/app/settings.json':       () => ({ name:'営業案件管理(モック)', description:'harness mock', icon:{type:'PRESET',key:'APP44'}, theme:'WHITE', revision:'12' }),
  '/k/v1/app.json':                () => ({ appId:'1', name:'営業案件管理(モック)', description:'harness mock', spaceId:null, threadId:null, createdAt:'2026-01-01T00:00:00Z', creator:{code:'admin',name:'管理者'} }),
  '/k/v1/app/form/fields.json':    () => ({ revision:'5', properties:SAMPLE_FIELDS }),
  '/k/v1/app/form/layout.json':    () => ({ revision:'5', layout:[{type:'ROW',fields:[{type:'SINGLE_LINE_TEXT',code:'顧客名',size:{width:'200'}}]}] }),
  '/k/v1/form.json':               () => ({ properties: Object.values(SAMPLE_FIELDS).map(f => ({code:f.code,label:f.label,type:f.type,required:!!f.required})) }),
  '/k/v1/app/views.json':          () => ({ revision:'2', views:SAMPLE_VIEWS }),
  '/k/v1/app/reports.json':        () => ({ revision:'1', reports:{} }),
  '/k/v1/app/status.json':         () => ({ revision:'1', enable:false, states:{}, actions:[] }),
  '/k/v1/app/plugins.json':        () => ({ revision:'1', plugins:[] }),
  '/k/v1/app/customize.json':      () => ({ revision:'1', desktop:{js:[],css:[]}, mobile:{js:[],css:[]}, scope:'ALL' }),
  '/k/v1/app/actions.json':        () => ({ revision:'1', actions:{} }),
  '/k/v1/app/acl.json':            () => ({ revision:'1', rights:[{entity:{type:'CREATOR',code:null},appEditable:true,recordViewable:true,recordAddable:true,recordEditable:true,recordDeletable:true,reportViewable:true,appManageable:true}] }),
  '/k/v1/field/acl.json':          () => ({ revision:'1', rights:[] }),
  '/k/v1/record/acl.json':         () => ({ revision:'1', rights:[] }),
  '/k/v1/app/notifications/general.json':   () => ({ revision:'1', notifications:[{entity:{type:'USER',code:'admin'},includeSubs:false,recordAdded:true,recordEdited:true,commentAdded:true,statusChanged:false,fileImported:false}], notifyToCommenter:true }),
  '/k/v1/app/notifications/perRecord.json': () => ({ revision:'1', notifications:[] }),
  '/k/v1/app/notifications/reminder.json':  () => ({ revision:'1', notifications:[], timezone:'Asia/Tokyo' }),
  '/k/v1/app/categories.json':              () => ({ revision:'1', categories:{}, enabled:false }),
  '/k/v1/records.json':            () => ({ records:[], totalCount:'0' }),
  '/k/v1/apps.json':               () => ({ apps:[{appId:'1',name:'営業案件管理(モック)',description:''}] })
};

window.kintone = {
  app: { getId: () => 1, getQueryCondition: () => '' },
  api: (url, method, params) => {
    log('[mock-api]', method, url, params || '');
    const path = String(url).replace(/^https?:\/\/[^/]+/, '');
    const handler = ROUTES[path];
    if (handler) return Promise.resolve(handler(params));
    if (method === 'GET') return Promise.resolve({});
    if (method === 'PUT' || method === 'POST') return Promise.resolve({ revision:'99' });
    if (method === 'DELETE') return Promise.resolve({});
    return Promise.resolve({});
  },
  getLoginUser: () => ({ id:'1', code:'admin', name:'管理者', email:'admin@example.com', timezone:'Asia/Tokyo', language:'ja' }),
  getUiVersion: () => 1
};
window.kintone.api.url = (path, full) => path;
window.kintone.api.urlForGet = (path, params, full) => path;

document.getElementById('boot').addEventListener('click', () => boot(false));
document.getElementById('boot-popout').addEventListener('click', () => boot(true));
document.getElementById('reset').addEventListener('click', () => location.reload());

function boot(popout){
  log('[harness] loading 統合ツール.js …');
  // popoutを抑えたい時は window.open を一時的に殺す
  if (!popout) {
    const orig = window.open;
    window.open = () => null;
    setTimeout(() => { window.open = orig; }, 5000);
  }
  const s = document.createElement('script');
  s.src = '統合ツール.js';
  s.onload = () => {
    log('[harness] script loaded; KUS:', !!window.__KUS__);
    try {
      // boot.ts は autoboot 経路でも、export された runKintoneUnifiedSuite は __KUS__ には載らない
      // ので、bundle 内 IIFE が即時に runKintoneUnifiedSuite を呼ぶか確認する
      if (typeof window.runKintoneUnifiedSuite === 'function') {
        window.runKintoneUnifiedSuite({});
      } else {
        log('[harness] runKintoneUnifiedSuite が globally 公開されていない。autoboot に依存します。');
      }
    } catch (e) {
      log('[harness] error:', e && e.message || e);
    }
  };
  s.onerror = () => log('[harness] failed to load 統合ツール.js (run npm run build first)');
  document.head.appendChild(s);
}
</script>
</body></html>
